# Pages CMS editor (https://pagescms.org)
# Bassem logs in at app.pagescms.org with his GitHub account and edits everything below
# through simple forms. Every save updates the live website within about a minute.

media:
  input: assets/uploads
  output: assets/uploads

content:
  - name: site
    label: My website
    type: file
    path: content/site.json
    format: json
    fields:
      - name: name
        label: Name
        type: string
      - name: nameArabic
        label: Name in Arabic
        type: string
      - name: tagline
        label: Small line above the big title
        type: string
      - name: heroTitle
        label: Big title on the first screen (new line = line break)
        type: text
      - name: heroNote
        label: Hint next to the light
        type: string
      - name: intro
        label: Short introduction
        type: text
      - name: portrait
        label: My photo
        type: image
      - name: stats
        label: Numbers
        type: object
        list: true
        fields:
          - { name: value, label: Number, type: string }
          - { name: label, label: What it means, type: string }
      - name: categories
        label: Gallery filters (mediums)
        type: string
        list: true

      - name: works
        label: Artworks (drag to reorder)
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string, required: true }
          - { name: image, label: Picture, type: image, required: true }
          - { name: year, label: Year, type: string }
          - { name: category, label: "Filter (must match one of the gallery filters)", type: string }
          - { name: medium, label: Medium (e.g. Charcoal on paper), type: string }
          - { name: size, label: Size (e.g. 50 × 70 cm), type: string }
          - name: status
            label: Status
            type: select
            options:
              values: ["", Available, Commissioned, Private collection, Sold, Sold out, Not for sale]
          - { name: price, label: Price (optional), type: string }
          - { name: link, label: Link (shop page or Instagram post), type: string }
          - { name: story, label: The story behind it, type: text }

      - name: detail
        label: Big close-up between gallery and workshops
        type: object
        fields:
          - { name: image, label: Picture, type: image }
          - { name: quote, label: Quote, type: string }
          - { name: source, label: Under the quote, type: string }

      - name: teaching
        label: Workshops & teaching
        type: object
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
          - name: images
            label: Workshop photos (three look best)
            type: object
            list: true
            fields:
              - { name: src, label: Photo, type: image }
              - { name: caption, label: Caption, type: string }
          - { name: cta, label: Link text at the end, type: string }
          - name: sessions
            label: Workshops (newest first)
            type: object
            list: true
            fields:
              - { name: date, label: Date (e.g. Oct 2026), type: string }
              - { name: title, label: Workshop name, type: string }
              - { name: place, label: Where, type: string }

      - name: press
        label: Press quotes
        type: object
        list: true
        fields:
          - { name: quote, label: Quote, type: text }
          - { name: source, label: Who said it, type: string }
          - { name: link, label: Link to article, type: string }

      - name: exhibitions
        label: Exhibitions
        type: object
        list: true
        fields:
          - { name: year, label: Year, type: string }
          - { name: title, label: Exhibition, type: string }
          - { name: place, label: Where, type: string }

      - name: guide
        label: Free guide (email sign-up)
        type: object
        fields:
          - { name: eyebrow, label: Small label, type: string }
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
          - { name: button, label: Button text, type: string }
          - { name: success, label: Thank-you message, type: text }
          - { name: downloadUrl, label: Link to the guide, type: string }
          - { name: formEndpoint, label: "Email service address (from Formspree, ask your helper)", type: string }

      - name: commission
        label: Commissions
        type: object
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
          - { name: steps, label: Steps, type: string, list: true }

      - name: contact
        label: Contact & links
        type: object
        fields:
          - { name: email, label: Email, type: string }
          - { name: instagram, label: Instagram link, type: string }
          - { name: instagramHandle, label: Instagram name, type: string }
          - { name: shop, label: Shop link, type: string }
          - { name: tashkeel, label: Tashkeel profile link, type: string }
